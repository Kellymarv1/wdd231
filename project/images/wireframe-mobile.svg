<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500" width="100%" height="100%">
 <!-- Phone Outline -->
 <rect x="10" y="10" width="280" height="480" rx="20" fill="#ffffff" stroke="#333333" stroke-width="3"/>
 <!-- Header -->
 <rect x="30" y="30" width="240" height="40" rx="4" fill="#e2e8f0" stroke="#cbd5e1"/>
 <text x="45" y="55" font-family="sans-serif" font-size="12" fill="#475569">Logo &amp; Hamburger Menu</text>
 <!-- Hero -->
 <rect x="30" y="85" width="240" height="100" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
 <text x="75" y="140" font-family="sans-serif" font-size="12" fill="#475569">Hero Banner / Mission</text>
 <!-- CTA Button -->
 <rect x="70" y="200" width="160" height="30" rx="6" fill="#cbd5e1" stroke="#94a3b8"/>
 <text x="105" y="220" font-family="sans-serif" font-size="11" fill="#334155">Adopt Today Button</text>
 <!-- Featured Pet 1 -->
 <rect x="30" y="245" width="240" height="65" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
 <text x="70" y="282" font-family="sans-serif" font-size="11" fill="#64748b">Featured Pet Card 1</text>
 <!-- Featured Pet 2 -->
 <rect x="30" y="320" width="240" height="65" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
 <text x="70" y="357" font-family="sans-serif" font-size="11" fill="#64748b">Featured Pet Card 2</text>
 <!-- Footer -->
 <rect x="30" y="400" width="240" height="65" rx="4" fill="#e2e8f0" stroke="#cbd5e1"/>
 <text x="85" y="437" font-family="sans-serif" font-size="11" fill="#475569">Footer &amp; Hours</text>
</svg>